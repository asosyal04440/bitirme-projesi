# Builds the iOS app on a macOS runner (no Mac needed locally).
# The result is an unsigned .ipa: it proves the app and the Rust core build for iOS and can be
# installed with a sideloading tool that signs it with the user's Apple ID. Distribution through
# TestFlight or the App Store needs an Apple Developer account and signing secrets.
name: iOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the .ipa to (empty: artifact only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios

      - name: Dependencies
        run: |
          flutter --disable-analytics
          flutter pub get

      - name: Build
        run: flutter build ios --release --no-codesign

      - name: Package unsigned ipa
        id: package
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          name="sinav-okuyucu-${version}-ios-unsigned.ipa"
          rm -rf Payload && mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "$name" Payload
          ls -la "$name"
          echo "file=mobile/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ios-unsigned-ipa
          path: ${{ steps.package.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$TAG" "${{ steps.package.outputs.file }}" --clobber

  # Runs the on-device integration tests (Word import, photo reading, review, SQLite, Excel)
  # on an iPhone simulator, so the iOS build is exercised and not only compiled.
  simulator-test:
    # Started by hand (Actions → iOS → Run workflow); releases only need the ipa.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-apple-ios-sim

      - name: Dependencies
        run: |
          flutter --disable-analytics
          flutter pub get

      - name: Boot simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in sorted(devices.items(), reverse=True)
                     if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Integration tests
        run: flutter test integration_test -d "${{ steps.sim.outputs.udid }}"
