[package]
name = "rust_lib_sinav_okuyucu"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
anyhow = "1"
exam-core = { path = "../../crates/exam_core" }
exam-application = { path = "../../crates/exam_application" }
exam-import = { path = "../../crates/exam_import" }
exam-infrastructure = { path = "../../crates/exam_infrastructure" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
rust_xlsxwriter = "0.99.1"

# libc 0.2.190 no longer exposes the `_dyld_*` functions on iOS, which breaks `backtrace` 0.3.76
# (pulled in by flutter_rust_bridge). Remove the pin once a fixed libc or backtrace is released.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
